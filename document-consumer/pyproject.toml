[project]
name = "document-consumer"
version = "0.1.0"
description = "RAG-based document processing service with LangChain and Faststream"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Faststream & Messaging
    "faststream[kafka]>=0.5.0",
    "aiokafka>=0.11.0",

    # LangChain
    "langchain>=0.1.0",
    "langchain-community>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=0.1.0",

    # Document processing
    "pypdf>=3.0.0",  # Lighter than pdfplumber
    # "python-docx>=1.0.0",  # TODO: add when needed
    # "beautifulsoup4>=4.12.0",  # TODO: add when needed
    # "unstructured>=0.11.0",  # TODO: heavy, add only if needed

    # Embeddings (will download on first use)
    "sentence-transformers>=2.0.0",
    # "transformers>=4.35.0",  # Included in sentence-transformers

    # Vector Store (to be selected)
    "qdrant-client>=1.7.0",

    # LLM (TODO: add when implementing query responses)
    # "openai>=1.0.0",
    # "anthropic>=0.18.0",
    # "mistralai>=0.1.0",

    # Storage (TODO: add when implementing MinIO downloads)
    # "minio>=7.2.0",

    # Utilities
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # Monitoring & Logging
    # "prometheus-client>=0.19.0",  # TODO: add when implementing metrics
    "structlog>=24.0.0",

    # Evaluation (TODO: add when running experiments)
    # "ragas>=0.1.0",
    # "numpy>=1.26.0",  # Included in sentence-transformers
    # "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
