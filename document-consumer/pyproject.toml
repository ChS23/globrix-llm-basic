[project]
name = "document-consumer"
version = "0.1.0"
description = "RAG-based document processing service"
requires-python = ">=3.12"
dependencies = [
    # FastStream с RabbitMQ и CLI
    "faststream[rabbit,cli]>=0.5.0",
    # LangChain компоненты
    "langchain>=0.1.0",
    "langchain-community>=0.1.0",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=0.1.0",
    "langchain-qdrant>=0.1.0",
    # Обработка PDF
    "langchain-pymupdf4llm>=0.1.0",
    # Векторная БД
    "qdrant-client>=1.7.0",
    # OpenAI для эмбеддингов
    "openai>=1.0.0",
    # Настройки и логирование
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "supabase>=2.25.1",
    # RAG Evaluation
    "deepeval>=3.7.5",
    "httpx>=0.27.0",
    "ragas>=0.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",  # Для мокирования
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["test_data*"]
