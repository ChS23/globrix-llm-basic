[pytest]
# Конфигурация pytest

# Автоматически определять async тесты
asyncio_mode = auto

# Где искать тесты
testpaths = tests

# Минимальный уровень логирования
log_cli = true
log_cli_level = INFO

# Маркеры для разных типов тестов
markers =
    unit: Unit tests (быстрые, не требуют внешних сервисов)
    integration: Integration tests (требуют Docker сервисы)
    slow: Медленные тесты
