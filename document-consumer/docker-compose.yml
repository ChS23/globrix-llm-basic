services:
  # RabbitMQ - очередь сообщений
  # Используется для получения PDF документов
  rabbitmq:
    image: rabbitmq:3-management
    container_name: globrix-rabbitmq
    ports:
      - "5672:5672"    # Порт для подключения приложений
      - "15672:15672"  # Порт для веб-интерфейса управления (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Qdrant - векторная база данных
  # Хранит эмбеддинги документов для быстрого поиска
  qdrant:
    image: qdrant/qdrant:latest
    container_name: globrix-qdrant
    ports:
      - "6333:6333"  # HTTP API (основной порт)
      - "6334:6334"  # gRPC API (опционально, для более быстрого доступа)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

# Volumes для сохранения данных
# Даже если контейнеры удалены, данные сохранятся
volumes:
  rabbitmq_data:
  qdrant_data:
